name: Q1 Java Build

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'java/src/**'
      - 'java/Dockerfile'
      - 'java/pom.xml'

jobs:
  saudacao:
    runs-on: ubuntu-latest
    steps:
      - name: Rodando Q1
    run: echo "Q1 rodando, ${{ github.actor }}!"
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B compile
